<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - معلومات تسجيل دخول الزبائن</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --bg-color: #050508; --card-bg: #0f1019; --primary-blue: #00d2ff; --primary-purple: #9d4edd; --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #9d4edd 100%); --text-color: #ffffff; --text-muted: #a0a0b0; --border-color: rgba(0, 210, 255, 0.2); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 40px 5%; }
        
        .admin-container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2.2rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(0, 210, 255, 0.1); color: var(--primary-blue); font-weight: 700; }
        tr:hover { background: rgba(255,255,255,0.02); }
        .no-data { text-align: center; padding: 30px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>سجلات تسجيل دخول الزبائن</h1>
        <table>
            <thead>
                <tr>
                    <th>اسم الزبون</th>
                    <th>رقم الجوال (+970)</th>
                    <th>كلمة المرور المسجلة</th>
                    <th>وقت الدخول</th>
                </tr>
            </thead>
            <tbody id="loginsTableBody">
                <tr><td colspan="4" class="no-data">جاري جلب البيانات...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDesProgram...",
            authDomain: "desprogram-89c6a.firebaseapp.com",
            projectId: "desprogram-89c6a",
            storageBucket: "desprogram-89c6a.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:1234:web:1234"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const tableBody = document.getElementById('loginsTableBody');

        // جلب البيانات من مجموعة client_logins بشكل حي ومحدث
        db.collection("client_logins").orderBy("loginTime", "desc").onSnapshot((snapshot) => {
            if (snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="4" class="no-data">لا توجد سجلات دخول حتى الآن.</td></tr>`;
                return;
            }

            let rows = "";
            snapshot.forEach((doc) => {
                let data = doc.data();
                let timeFormatted = data.loginTime ? data.loginTime.toDate().toLocaleString('ar-EG') : 'وقت غير متوفر';
                
                rows += `
                    <tr>
                        <td>${data.name}</td>
                        <td style="direction: ltr; text-align: right;">${data.phone}</td>
                        <td><code style="background:rgba(0,0,0,0.5); padding:4px 8px; border-radius:4px; color:#00d2ff;">${data.password}</code></td>
                        <td>${timeFormatted}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = rows;
        });
    </script>
</body>
</html>
